spring:
  application:
    name: webhooklab
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/webhooklab}
    username: ${DB_USERNAME:webhooklab}
    password: ${DB_PASSWORD:webhooklab}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

delivery:
  target-url: ${DELIVERY_TARGET_URL:http://localhost:8081/webhook}
