services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: webhooklab
      POSTGRES_USER: webhooklab
      POSTGRES_PASSWORD: webhooklab
    ports:
      - "5432:5432"
    volumes:
      - webhooklab-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webhooklab -d webhooklab"]
      interval: 5s
      timeout: 5s
      retries: 10

  wiremock:
    image: wiremock/wiremock:3.13.1
    command: ["--global-response-templating", "--verbose"]
    ports:
      - "8081:8080"
    volumes:
      - ./infra/wiremock:/home/wiremock
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/__admin/health"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/webhooklab
      DB_USERNAME: webhooklab
      DB_PASSWORD: webhooklab
      DELIVERY_TARGET_URL: http://wiremock:8080/webhook
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      wiremock:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12

  verify:
    profiles: ["tools"]
    image: maven:3.9.11-eclipse-temurin-21
    working_dir: /workspace
    volumes:
      - .:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["mvn", "-B", "verify"]
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TESTCONTAINERS_RYUK_DISABLED: "true"
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal

volumes:
  webhooklab-postgres:
