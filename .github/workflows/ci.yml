name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Verify formatting, unit tests and integration tests in Docker
        run: docker compose --profile tools run --rm verify
      - name: Upload Surefire and Failsafe reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: maven-test-reports
          if-no-files-found: warn
          path: |
            target/surefire-reports/**
            target/failsafe-reports/**
