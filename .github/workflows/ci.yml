name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Java 21 and Maven cache
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Make Maven Wrapper executable
        run: chmod +x ./mvnw
      - name: Verify formatting, unit tests and integration tests
        run: ./mvnw -B verify
      - name: Upload Surefire and Failsafe reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: maven-test-reports
          if-no-files-found: warn
          path: |
            target/surefire-reports/**
            target/failsafe-reports/**
